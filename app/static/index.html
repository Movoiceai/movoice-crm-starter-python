<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Movoice CRM starter</title>
  <style>
    :root { --bg:#f5f5f7; --card:#fff; --ink:#1d1d1f; --muted:#6e6e73; --line:#e5e5ea; --good:#1a7f37; --warn:#9a6700; --bad:#cf222e; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#000; --card:#1c1c1e; --ink:#f5f5f7; --muted:#a1a1a6; --line:#2c2c2e; --good:#3fb950; --warn:#d29922; --bad:#f85149; }
    }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
    main { max-width:760px; margin:0 auto; padding:32px 16px; }
    h1 { margin:0 0 4px; font-size:28px; }
    code { font-size:13px; }
    .muted { color:var(--muted); }
    .small { font-size:13px; }
    ul { list-style:none; margin:24px 0 0; padding:0; background:var(--card); border-radius:14px; overflow:hidden; }
    li { padding:14px 16px; border-top:1px solid var(--line); }
    li:first-child { border-top:0; }
    .row { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
    .who { display:flex; flex-direction:column; flex:1 1 220px; min-width:0; }
    .name { font-weight:600; }
    .phone { font-variant-numeric:tabular-nums; color:var(--muted); }
    .status { font-size:13px; color:var(--muted); min-width:84px; }
    .status-called { color:var(--good); } .status-not-reached { color:var(--warn); } .status-failed { color:var(--bad); }
    .action { display:flex; flex-direction:column; align-items:flex-end; gap:4px; }
    button { font:inherit; font-weight:600; padding:8px 14px; border-radius:10px; border:1px solid var(--ink); background:transparent; color:var(--ink); cursor:pointer; }
    button:disabled { opacity:.5; cursor:default; }
    .error { color:var(--bad); font-size:13px; max-width:260px; text-align:right; }
    .result { margin:8px 0 0; font-size:14px; }
  </style>
</head>
<body>
<main>
  <h1>Leads</h1>
  <p class="muted">Press <strong>Call with AI</strong> and your Movoice agent calls the lead. The result appears here
    when Movoice posts it to <code>/movoice/webhook</code>.</p>
  <ul id="leads"></ul>
</main>
<script>
  // Everything is drawn with textContent, so nothing in a lead or a summary can inject HTML.
  const list = document.getElementById("leads");
  const errors = {};
  let timer = null;

  const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
  function formatPhone(p) {
    let m = /^\+1(\d{3})(\d{3})(\d{4})$/.exec(p); if (m) return `+1 ${m[1]} ${m[2]} ${m[3]}`;
    m = /^\+91(\d{5})(\d{5})$/.exec(p); if (m) return `+91 ${m[1]} ${m[2]}`;
    return p;
  }
  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function resultLine(lead) {
    if (lead.status === "calling") return "Calling…";
    const r = lead.lastResult;
    if (!r) return null;
    const parts = [cap(lead.status), r.outcome];
    if (r.summary) parts.push(`“${r.summary}”`);
    return parts.join(" · ") + (r.durationSeconds ? ` (${r.durationSeconds} s)` : "");
  }

  async function load() {
    const { leads } = await (await fetch("/api/leads")).json();
    list.replaceChildren(...leads.map((lead) => {
      const li = el("li");
      const row = el("div", "row");
      const who = el("div", "who");
      who.append(el("span", "name", lead.name), el("span", "phone", formatPhone(lead.phone)));
      if (lead.note) who.append(el("span", "muted small", lead.note));
      const action = el("span", "action");
      const button = el("button", null, lead.status === "new" ? "Call with AI" : "Call again");
      button.type = "button";
      button.onclick = () => call(lead.id, button);
      action.append(button);
      if (errors[lead.id]) { const a = el("span", "error", errors[lead.id]); a.setAttribute("role", "alert"); action.append(a); }
      row.append(who, el("span", `status status-${lead.status.replace(" ", "-")}`, cap(lead.status)), action);
      li.append(row);
      const line = resultLine(lead);
      if (line) li.append(el("p", "result", `→ ${line}`));
      return li;
    }));
    // While a call is in progress, re-read the list every 3 seconds so the webhook's result shows up.
    const waiting = leads.some((l) => l.status === "calling" || l.status === "in call");
    clearTimeout(timer);
    if (waiting) timer = setTimeout(load, 3000);
  }

  async function call(id, button) {
    button.disabled = true;
    button.textContent = "Calling…";
    delete errors[id];
    try {
      const res = await fetch(`/api/leads/${encodeURIComponent(id)}/call`, { method: "POST" });
      if (!res.ok) errors[id] = (await res.json().catch(() => ({}))).error || `The call could not be placed (${res.status}).`;
    } catch {
      errors[id] = "Could not reach this server.";
    }
    load();
  }

  load();
</script>
</body>
</html>
